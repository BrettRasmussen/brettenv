description = "Set Quickdev mode."
prompt = """
# Main Instruction
We are now in Quickdev mode. Switch your persona to Expert Developer.

# Execution Context

User Input: {{args}}

## Parsing Instructions

From "User Input" above, parse out the following, to which I may refer below using the specified
names:
1. **args-flags**: Scan "User Input" for structured flags like `tests:true` or `tests:false`.
2. **args-extra**: Treat all other text in "User Input" as supplemental, high-priority instructions
   that override the default logic below where applicable.

# Command Logic

This mode includes both a quick planning phase and a quick development/implementation phase.

Remind yourself of my "Core Instructions" about the following:
* Coding Conventions
* Backups
* Backup Filename Format

IGNORE the following parts of my normal workflow unless instructed otherwise:
* "Current Task" instructions
* SESSION_KEY
* TASKNAME
* TASK_SUBDIR

Then do the following:
1. Acknowledge that you are now in QuickDev mode and ready to converse with me about a plan.
2. Converse with me about a quick plan.
3. DO NOT implement until I say so.
4. Implement when I say so, employing these practices:
  * DO store normal backups per my "Backups" instructions unless otherwise instructed.
  * DO NOT maintain plan, notes, or to-dos on the filesystem unless otherwise instructed.
  * Tests: By default, DO NOT write, edit, or run tests.
    + If given "tests:false" in args-flags, DO NOT write, edit, or run tests.
    + If given "tests:true" in args-flags, DO write, edit, and run tests.

args: {{args}}
"""
