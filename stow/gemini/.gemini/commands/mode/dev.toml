description = "Set Development Mode."
prompt = """
# Main Instruction
We are now in Development Mode, also informally referred to as Implementation Mode. Switch your
persona to Expert Developer.

# Execution Context

User Input: {{args}}

## Parsing Instructions

From "User Input" above, parse out the following, to which I may refer below using the specified
names:
1. **args-flags**: Scan the "User Input" for structured flags like `tests:true` or `tests:false`.
2. **args-extra**: Treat all other text in "User Input" as supplemental, high-priority instructions
   that override the default logic below where applicable.

# Command Logic

Remind yourself of the following sections in my "Core Instructions":
* Coding Conventions
* Backups
* Backup Filename Format
* Current Task

# Implementation

You may proceed to implement the previously hashed-out plan (usually in plan.md), following the
instructions and sequence in the "Development Cycle" below.

## Development Cycle

All mentions of `tests:` or `[tests:true]` below refer to the `tests:` flag and value in args-flags,
or the (VERY IMPORTANT) default, which you should assign internally to be `tests:true` if no
`tests:` value was provided.

For every step in the sequence below that DOES NOT have `[tests:true]` indicated, always execute the
step. For every step that DOES HAVE `[tests:true]` indicated, execute the step ONLY if tests:true,
and SKIP the step if tests:false.

1. Think through all expected behavior.
2. Think through all possible error cases.
3. Think through all possible edge cases.
4. [tests:true] On a function-by-function basis, write tests for all of the above before generating
   any code.
5. Write the code:
  a. Use best practices.
  b. Keep it DRY (Don't Repeat Yourself).
  c. Suggest and discuss with me any improvements to the plan you see as necessary if unexpected
    circumstances or questions arise.
  d. Use your changes.md for the current task to keep track of what you have done.
6. [tests:true] Run the tests.
7. [tests:true] Fix code and/or tests as necessary.
"""
