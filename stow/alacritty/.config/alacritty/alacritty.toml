[env]
TERM = "xterm-256color"

[window]
option_as_alt = "Both"
dimensions = { columns = 110, lines = 45 }
padding = { x = 5, y = 5 }

[font]
# NOTE: Alacritty has bolder-looking fonts than other terminals by default. The fix:
#   prompt$ defaults write org.alacritty AppleFontSmoothing -int 0
normal.family = "Agave Nerd Font Mono"
bold.family = "Agave Nerd Font Mono"
italic.family = "Agave Nerd Font Mono"
bold_italic.family = "Agave Nerd Font Mono"
size = 18.0

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "ArrowLeft", mods = "Command|Alt", action = "SelectPreviousTab" },
  { key = "ArrowRight", mods = "Command|Alt", action = "SelectNextTab" },
  { key = "N", mods = "Command", action = "CreateNewWindow" },
  { key = "J", mods = "Alt|Shift", chars = "\u001bJ" },
  { key = "K", mods = "Alt|Shift", chars = "\u001bK" },
  { key = "J", mods = "Control|Alt", chars = "\u001b\u000a" },
  { key = "K", mods = "Control|Alt", chars = "\u001b\u000b" },
  { key = "1", mods = "Control", chars = "\u001b[49;5u" },
  { key = "2", mods = "Control", chars = "\u001b[50;5u" },
  { key = "3", mods = "Control", chars = "\u001b[51;5u" },
  { key = "4", mods = "Control", chars = "\u001b[52;5u" },
  { key = "5", mods = "Control", chars = "\u001b[53;5u" },
  { key = "6", mods = "Control", chars = "\u001b[54;5u" },
  { key = "7", mods = "Control", chars = "\u001b[55;5u" },
  { key = "8", mods = "Control", chars = "\u001b[56;5u" },
  { key = "9", mods = "Control", chars = "\u001b[57;5u" },
  { key = "0", mods = "Control", chars = "\u001b[48;5u" },
  { key = "Period", mods = "Control", chars = "\u001b[46;5u" },
  { key = "Minus", mods = "Control", chars = "\u001b[45;5u" },
  { key = "Apostrophe", mods = "Control", chars = "\u001b[39;5u" },
  { key = "Comma", mods = "Control", chars = "\u001b[44;5u" },
  { key = "Equals", mods = "Control", chars = "\u001b[61;5u" },
  { key = "I", mods = "Control", chars = "\u001b[105;5u" },
  { key = "U", mods = "Control", chars = "\u001b[117;5u" },
  { key = "M", mods = "Control", chars = "\u001b[109;5u" },
  { key = "H", mods = "Control", chars = "\u001b[104;5u" },
  { key = "J", mods = "Control", chars = "\u001b[106;5u" },
  { key = "Semicolon", mods = "Control", chars = "\u001b[59;5u" },
  { key = "Slash", mods = "Control", chars = "\u001b[47;5u" },
  { key = "Grave", mods = "Control", chars = "\u001b[96;5u" },
  { key = "BracketLeft", mods = "Control", chars = "\u001b[91;5u" },
  { key = "BracketRight", mods = "Control", chars = "\u001b[93;5u" },
  { key = "Backslash", mods = "Control", chars = "\u001b[92;5u" },
  { key = "Space", mods = "Control", chars = "\u001b[32;5u" },
  { key = "Return", mods = "Control", chars = "\u001b[13;5u" },
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Tab", mods = "Control", chars = "\u001b[9;5u" },
  { key = "Tab", mods = "Control|Shift", chars = "\u001b[9;6u" },
  { key = "Back", mods = "Control", chars = "\u001b[127;5u" },
]
